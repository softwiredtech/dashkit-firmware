name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache keys
        id: keys
        run: |
          echo "idf=$(git ls-tree --object-only HEAD esp-idf)" >> "$GITHUB_OUTPUT"
          echo "py=$(python3 -V | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # ESP-IDF checkout (worktree + git objects) and its installed tools
      # (~/.espressif: xtensa toolchain, python venv). Keyed on the pinned
      # submodule commit, so bumping the submodule rebuilds the cache; the
      # python version is in the key because the venv breaks if the runner
      # image upgrades python.
      - name: Cache ESP-IDF and tools
        id: cache-idf
        uses: actions/cache@v4
        with:
          path: |
            esp-idf
            .git/modules/esp-idf
            ~/.espressif
          key: idf-${{ runner.os }}-${{ steps.keys.outputs.idf }}-${{ steps.keys.outputs.py }}

      - name: Fetch ESP-IDF and install toolchain
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive
          ./esp-idf/install.sh esp32s3

      # Compiler cache: makes the compile step itself fast on repeat builds.
      # Key on the commit so every run saves; restore-keys picks the newest.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Build
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: /home/runner/.ccache
        run: |
          . ./esp-idf/export.sh
          idf.py build
          ccache -s

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: dashkit-firmware-${{ github.sha }}
          path: build/dashkit-firmware.bin
          retention-days: 14

  # Host-side Tesla crypto/session unit tests (Phase 0). No ESP-IDF needed:
  # the runner builds a pinned mbedTLS 3.6.2 into a local prefix.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache mbedTLS host build
        uses: actions/cache@v4
        with:
          path: build/tesla-host-test
          key: mbedtls-host-${{ runner.os }}-3.6.2

      - name: Run Tesla crypto known-answer tests
        run: bash tools/test/run_tesla_crypto_test.sh

      - name: Run Tesla advertisement-name matcher tests (Phase 1)
        run: bash tools/test/run_tesla_advert_name_test.sh

      - name: Run Tesla Phase 2 protocol round-trip tests (handshake/command/response)
        run: bash tools/test/run_tesla_session_test.sh

      - name: Run Tesla Phase 3 enrollment tests (keygen + present-key message)
        run: bash tools/test/run_tesla_enrollment_test.sh
